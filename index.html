    </div>

      <h2>测评说明</h2>
      <p>• 本测评共 100 题，根据近两周真实状态作答。</p>
      <p>• 分为【18岁以下版】和【18岁以上成人版】，题目完全不同。</p>
      <p>• 分数标准：</p>
      <p>✅ 90分以上：完全无抑郁</p>
      <p>⚠️ 80~89分：轻度抑郁</p>
      <p>⚠️ 70~79分：中度抑郁</p>
      <p>⚠️ 60~69分：中上度抑郁</p>
      <p>🆘 60分以下：高度抑郁</p>
      <p>• 所有测评记录自动保存，可在历史记录中查看。</p>
    </div>

    <div class="age-select">
      <button class="btn btn-under-18" onclick="startQuiz('under18')">18 岁以下测评</button>
      <button class="btn btn-adult" onclick="startQuiz('adult')">18 岁以上测评</button>
    </div>

    <button class="btn btn-history" onclick="showHistory()">查看历史记录</button>

    <div class="disclaimer">
      本测评仅为状态参考，不构成医学诊断。<br>
      如持续情绪低落、痛苦，请及时寻求专业心理或精神科帮助。

    <div class="questions-box" id="questions-box"></div>

  </div>

  <!-- 结果页面 -->
  <div id="result-page">
    <div class="result-card">
      <h2>测评结果</h2>

    </div>

    <div class="advice-box">

      <div id="advice-content"></div>
    </div>

    <div class="result-btns">

</div>

// 开始问卷
function startQuiz(type) {
  currentType = type;
  document.getElementById("home").style.display = "none";
  document.getElementById("quiz-page").style.display = "block";
  document.getElementById("result-page").style.display = "none";
  document.getElementById("history-page").style.display = "none";

  let title = type === "under18" ? "18 岁以下抑郁状态测评（100题）" : "18 岁以上成人抑郁状态测评（100题）";
  document.getElementById("quiz-title").innerText = title;

  let qBox = document.getElementById("questions-box");
  qBox.innerHTML = "";

  let list = type === "under18" ? under18Questions : adultQuestions;

  list.forEach((item, index) => {
    let div = document.createElement("div");
    div.className = "question-item";
    div.innerHTML = `
      <div class="question-text">${index + 1}. ${item.text}</div>
      <div class="options">
        <label class="option"><input type="radio" name="q${index}" value="1" required> 完全符合</label>
        <label class="option"><input type="radio" name="q${index}" value="0"> 不完全符合</label>
      </div>
    `;
    qBox.appendChild(div);
  });
}

// 提交问卷
function submitQuiz() {
  let list = currentType === "under18" ? under18Questions : adultQuestions;
  let total = 0;

  list.forEach((_, index) => {
    let checked = document.querySelector(`input[name="q${index}"]:checked`);
    if (checked) {
      total += parseInt(checked.value);
    }
  });

  // 按你指定的分级
  let levelText = "";
  let levelColor = "";
  let advice = "";

  if (total >= 90) {
    levelText = "完全无抑郁";
    levelColor = "#16a34a";
    advice = "你目前情绪状态非常稳定，生活节奏良好，几乎没有抑郁倾向。请继续保持规律作息、适度运动、正常社交，遇到压力及时疏导即可。";
  } else if (total >= 80) {
    levelText = "轻度抑郁";
    levelColor = "#f59e0b";
    advice = "你存在轻度抑郁情绪，可能最近压力较大、休息不足。建议减少内耗，多休息，多做让自己放松的事，适当倾诉，一般通过自我调整可以明显改善。";
  } else if (total >= 70) {
    levelText = "中度抑郁";
    levelColor = "#ea580c";
    advice = "你处于中度抑郁状态，情绪低落、精力下降、兴趣减退比较明显。建议减少高强度压力，保证睡眠，多和信任的人沟通，必要时寻求心理咨询帮助。";
  } else if (total >= 60) {
    levelText = "中上度抑郁";
    levelColor = "#dc2626";
    advice = "你的抑郁状态比较明显，已经影响到日常心情与生活。请务必重视：不要独自硬扛，尽量寻求家人、朋友陪伴，强烈建议寻求专业心理或精神科帮助。";
  } else {
    levelText = "高度抑郁";
    levelColor = "#b91c1c";
    advice = "你目前处于高度抑郁状态，情绪、身体、生活都受到明显影响，非常痛苦。请立刻停止自我攻击，尽快联系家人、信任的人，并前往专业机构寻求帮助，你值得被好好对待。";
  }

  // 显示结果
  document.getElementById("quiz-page").style.display = "none";
  document.getElementById("result-page").style.display = "block";
  document.getElementById("final-score").innerText = total;
  document.getElementById("final-score").style.color = levelColor;
  document.getElementById("result-level").innerText = levelText;
  document.getElementById("result-level").style.color = levelColor;
  document.getElementById("result-desc").innerText = `总分：${total} 分，共 100 题`;
  document.getElementById("advice-content").innerHTML = `<p>${advice}</p>`;

  // 保存到本地历史记录
  saveHistory(currentType, total, levelText);
}

// 保存历史（JS + localStorage）
function saveHistory(type, score, level) {
  let history = JSON.parse(localStorage.getItem("depressionTestHistory")) || [];
  let typeName = type === "under18" ? "18岁以下版" : "18岁以上成人版";
  let now = new Date();
  let timeStr = now.toLocaleString();

  history.unshift({
    type: typeName,
    score: score,
    level: level,
    time: timeStr
  });

  localStorage.setItem("depressionTestHistory", JSON.stringify(history));
}

// 显示历史记录
function showHistory() {
  document.getElementById("home").style.display = "none";
  document.getElementById("quiz-page").style.display = "none";
  document.getElementById("result-page").style.display = "none";
  document.getElementById("history-page").style.display = "block";

  let history = JSON.parse(localStorage.getItem("depressionTestHistory")) || [];
  let listEl = document.getElementById("history-list");

  if (history.length === 0) {
    listEl.innerHTML = '<div class="empty-history">暂无测评记录</div>';
    return;
  }

  let html = "";
  history.forEach(item => {
    html += `
      <div class="history-item">
        <div class="history-type">${item.type}</div>
        <div class="history-time">${item.time}</div>
        <div class="history-score">得分：${item.score} 分</div>
        <div class="history-level">结果：${item.level}</div>
      </div>
    `;
  });

  listEl.innerHTML = html;
}

// 清空历史
function clearHistory() {
  if (confirm("确定要清空所有历史记录吗？此操作不可恢复。")) {
    localStorage.removeItem("depressionTestHistory");
    showHistory();
  }
}

// 返回首页
function goToHome() {
  document.getElementById("home").style.display = "block";
  document.getElementById("quiz-page").style.display = "none";
  document.getElementById("result-page").style.display = "none";
  document.getElementById("history-page").style.display = "none";
}

// 返回（从问卷回首页）
function goBack() {
  goToHome();
}
